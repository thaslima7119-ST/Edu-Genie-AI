<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>EduGenie | AI Learning Assistant</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='style.css') }}"
    >

</head>

<body>

    <main class="container">

        <header class="hero">

            <div>

                <p class="eyebrow">
                    AI-POWERED LEARNING
                </p>

                <h1>
                    EduGenie
                </h1>

                <p class="subtitle">
                    Your Google Gemini powered learning assistant
                </p>

            </div>

            <span
                id="status"
                class="status"
            >
                Ready
            </span>

        </header>


        <section class="card">

            <label for="task">
                Choose a task
            </label>

            <select id="task">

                <option value="qa">
                    Ask a Question
                </option>

                <option value="explain">
                    Explain a Topic
                </option>

                <option value="quiz">
                    Generate Quiz
                </option>

                <option value="summarize">
                    Summarize Text
                </option>

                <option value="recommendations">
                    Learning Path
                </option>

            </select>


            <div
                id="level-row"
                class="hidden"
            >

                <label for="level">
                    Your Level
                </label>

                <select id="level">

                    <option value="beginner">
                        Beginner
                    </option>

                    <option value="intermediate">
                        Intermediate
                    </option>

                    <option value="advanced">
                        Advanced
                    </option>

                </select>


                <label for="hours">
                    Hours per Week
                </label>

                <input
                    id="hours"
                    type="number"
                    min="1"
                    max="40"
                    value="5"
                >

            </div>


            <label
                for="inputText"
                id="inputLabel"
            >
                Your Question
            </label>


            <textarea
                id="inputText"
                rows="9"
                placeholder="Example: What is Artificial Intelligence?"
            ></textarea>


            <button id="submitBtn">
                Generate
            </button>

        </section>


        <section class="card result-card">

            <div class="result-heading">

                <h2>
                    Result
                </h2>

                <button
                    id="copyBtn"
                    class="secondary"
                    disabled
                >
                    Copy
                </button>

            </div>


            <div
                id="result"
                class="result empty"
            >
                Your result will appear here.
            </div>

        </section>


        <footer>
            EduGenie • FastAPI + Google Gemini
        </footer>

    </main>


    <script
        src="{{ url_for('static', path='app.js') }}"
    ></script>

</body>

</html>
